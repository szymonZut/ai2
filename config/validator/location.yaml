App\Entity\Location:
    properties:
        latitude:
            - Range:
                min: -90
                max: 90
                groups: [ 'app_location_new', 'app_location_edit' ]
                notInRangeMessage: 'Latitude must be between -90 and 90.'
        longitude:
            - Range:
                min: -180
                max: 180
                groups: [ 'app_location_new', 'app_location_edit' ]
                notInRangeMessage: 'Longitude must be between -180 and 180.'
